# A complete STRATUM build. Run with: stratum stack examples/recipe.yaml
# Trains every stratum listed, fuses them into one model, then runs the
# eval gates at the bottom - the build fails if a score misses its bar.
# Check it fits your machine first: stratum plan examples/recipe.yaml

base_model: Qwen/Qwen3-1.7B
optimizer: muon
load_4bit: true
system: "You are a precise assistant for invoice and support-ticket processing."

strata:
  - name: extract
    skill: examples/extract.jsonl
    out: strata/extract
    rank: 16
    epochs: 3
  - name: classify
    skill: examples/classify.jsonl
    out: strata/classify
    rank: 16
    epochs: 3

merge:
  method: linear # escalate to ties or dare if skills degrade after fusing
  weights: [1.0, 1.0]

output_model: models/invoice-slm

evals:
  - test: examples/test-extract.jsonl
    scorer: json_field
    min_score: 0.6 # raise as your data grows - these examples are tiny
  - test: examples/test-classify.jsonl
    scorer: exact
    min_score: 0.6
