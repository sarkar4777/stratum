[project]
name = "stratum-slm"
version = "0.1.0"
description = "Build industry-specific small language models from mergeable skill strata on commodity hardware."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "STRATUM contributors"}]
keywords = ["llm", "slm", "lora", "muon", "model-merging", "fine-tuning", "qlora", "peft"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    # transformers 5 requires torch >= 2.4. PyTorch publishes no macOS-Intel
    # build after 2.2.2, so there pip would install a transformers that then
    # refuses to use torch at all - every model load dying with a bare
    # "NameError: name 'torch' is not defined". Cap it on that platform only;
    # everywhere else a current torch is available, so stay unpinned.
    # The floor is 4.56, the release that renamed from_pretrained's torch_dtype
    # argument to dtype. Below that the models load with a deprecation warning
    # on every run; above it the old name is on borrowed time.
    "transformers>=4.56,<5; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "transformers>=4.56; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    "peft>=0.11",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43"]
serve = ["vllm>=0.6"]
corpus = ["pypdf>=4.0", "python-docx>=1.0", "python-pptx>=0.6", "openpyxl>=3.1", "pillow>=10.0"]
dev = ["pytest>=7.0", "pypdf>=4.0", "python-docx>=1.0", "python-pptx>=0.6", "openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/sarkar4777/stratum"
Documentation = "https://github.com/sarkar4777/stratum/tree/main/docs"
Issues = "https://github.com/sarkar4777/stratum/issues"

[project.scripts]
stratum = "stratum.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stratum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
