<svg width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="STRATUM logo: a cheerful robot made of stacked colorful layers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1035"/>
      <stop offset="100%" stop-color="#2d1a52"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5DCAA5"/><stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AFA9EC"/><stop offset="100%" stop-color="#7F77DD"/>
    </linearGradient>
    <linearGradient id="tile3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0997B"/><stop offset="100%" stop-color="#D85A30"/>
    </linearGradient>
    <linearGradient id="tile4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAC775"/><stop offset="100%" stop-color="#EF9F27"/>
    </linearGradient>
  </defs>

  <rect width="420" height="420" rx="72" fill="url(#bg)"/>

  <g transform="translate(210 214)">
    <ellipse cx="0" cy="150" rx="120" ry="20" fill="#000000" opacity="0.22"/>

    <!-- four stacked strata (tiles), each a skill layer -->
    <g stroke="#1b1035" stroke-width="5" stroke-linejoin="round">
      <rect x="-108" y="60" width="216" height="52" rx="16" fill="url(#tile4)"/>
      <rect x="-98"  y="18" width="196" height="52" rx="16" fill="url(#tile3)"/>
      <rect x="-88"  y="-24" width="176" height="52" rx="16" fill="url(#tile2)"/>
      <rect x="-78"  y="-66" width="156" height="52" rx="16" fill="url(#tile1)"/>
    </g>

    <!-- little seam studs suggesting mergeable tiles -->
    <g fill="#ffffff" opacity="0.55">
      <circle cx="-40" cy="86" r="4"/><circle cx="0" cy="86" r="4"/><circle cx="40" cy="86" r="4"/>
      <circle cx="-34" cy="44" r="4"/><circle cx="0" cy="44" r="4"/><circle cx="34" cy="44" r="4"/>
      <circle cx="-28" cy="2" r="4"/><circle cx="0" cy="2" r="4"/><circle cx="28" cy="2" r="4"/>
    </g>

    <!-- robot head sitting on top of the stack -->
    <g transform="translate(0 -140)">
      <rect x="-64" y="-40" width="128" height="86" rx="26" fill="#F1EFE8" stroke="#1b1035" stroke-width="5"/>
      <!-- antenna -->
      <line x1="0" y1="-40" x2="0" y2="-64" stroke="#1b1035" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="-70" r="8" fill="#5DCAA5" stroke="#1b1035" stroke-width="4"/>
      <!-- eyes -->
      <circle cx="-24" cy="-2" r="13" fill="#2d1a52"/>
      <circle cx="24" cy="-2" r="13" fill="#2d1a52"/>
      <circle cx="-20" cy="-6" r="4.5" fill="#ffffff"/>
      <circle cx="28" cy="-6" r="4.5" fill="#ffffff"/>
      <!-- smile -->
      <path d="M-22 22 Q0 40 22 22" fill="none" stroke="#2d1a52" stroke-width="5" stroke-linecap="round"/>
      <!-- cheek blush -->
      <circle cx="-44" cy="16" r="6" fill="#F0997B" opacity="0.7"/>
      <circle cx="44" cy="16" r="6" fill="#F0997B" opacity="0.7"/>
    </g>
  </g>

  <text x="210" y="392" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" letter-spacing="6">STRATUM</text>
</svg>
